#the server/client networking demonstration and lesson path.
services:
  server:
    image: phase00-lesson07-trial
    ports:
      - "18080:8000"
    command: ["python", "-m", "http.server", "8000", "--directory", "/app"]

  client:
    image: python:3.12-slim
    depends_on:
      - server
    command:
      - python
      - -c
      - |
          import urllib.request

          response = urllib.request.urlopen(
              "http://server:8000/container_trial.py"
          )
          print(f"Status: {response.status}")
          print(response.read().decode("utf-8"))